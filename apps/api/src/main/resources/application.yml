spring:
  application:
    name: ficas-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ficas}
    username: ${SPRING_DATASOURCE_USERNAME:ficas}
    password: ${SPRING_DATASOURCE_PASSWORD:ficas}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      validation-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 30
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${API_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-me-in-production-please-use-32b}
    ttl: PT24H
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  cookie:
    secure: false
  seed:
    admin-email: ${APP_SEED_ADMIN_EMAIL:admin@ficas.org.br}
    admin-password: ${APP_SEED_ADMIN_PASSWORD:admin123}
    admin-name: ${APP_SEED_ADMIN_NAME:Administrador}
  mail:
    enabled: ${APP_MAIL_ENABLED:false}
    host: ${APP_MAIL_HOST:smtp.gmail.com}
    port: ${APP_MAIL_PORT:587}
    username: ${APP_MAIL_USERNAME:}
    password: ${APP_MAIL_PASSWORD:}
    to: ${APP_MAIL_TO:contato@ficas.org.br}
  storage:
    local-dir: ${APP_STORAGE_LOCAL_DIR:./storage}
    # local = filesystem (default, offline/tests); s3 = AWS S3 / MinIO via the AWS SDK
    provider: ${APP_STORAGE_PROVIDER:local}

# Object storage (AWS S3 / MinIO) for the media layer. Disabled by default so the API
# boots with local-disk storage; enable with AWS_ENABLED=true and APP_STORAGE_PROVIDER=s3.
aws:
  enabled: ${AWS_ENABLED:false}
  access-key: ${AWS_ACCESS_KEY:}
  secret-key: ${AWS_SECRET_KEY:}
  region: ${AWS_REGION:us-east-1}
  # When set (e.g. http://minio:9000), the S3 client targets a MinIO/S3-compatible endpoint.
  endpoint: ${AWS_ENDPOINT:}
  path-style: ${AWS_PATH_STYLE:true}
  bucket:
    name: ${AWS_BUCKET_NAME:ficas-media}

logging:
  level:
    br.org.ficas: INFO
